<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="派對遊戲">
<meta name="theme-color" content="#2a1136">
<!-- 退出瀏覽器的強制深色(系統深色時會自動反轉我們的配色)。理由與另一半在 styles.css 開頭 -->
<meta name="color-scheme" content="only light">
<link rel="manifest" href="manifest.json">
<!-- 分頁與書籤圖示。Chrome/Edge 只認 rel="icon" —— manifest 的 icons 只給 PWA 安裝用,
     apple-touch-icon 只有 iOS 在用,兩者都不會變成 favicon;沒有這行就只會退回找網域根的
     /favicon.ico,而 GitHub Pages 走子路徑,那個位置不存在 → 書籤列空白(v1.52.2 修)。
     外殼是頂層 document,書籤圖示取自它,四頁都要有這行。 -->
<link rel="icon" type="image/svg+xml" href="img/icon.svg">
<link rel="apple-touch-icon" href="img/icon.svg">
<!-- 只寫「派對遊戲」,不列舉遊戲名(理由同 index.html)。外殼是頂層 document,
     分頁標籤看到的是這一行 —— 內層 iframe 的 <title> 不會蓋掉它 -->
<title>派對遊戲</title>
<!-- 外殼(shell)· v2.4.2 -->
<meta name="version" content="2.4.2">
<!--
  外殼:三個遊戲跑在下面那個滿版 iframe 裡,換遊戲 = 換 iframe 的 src。

  為什麼要有這一層(v1.50.0):Fullscreen API 綁在 document 上,**換頁瀏覽器一定收掉全螢幕**,
  而重進全螢幕一定要使用者手勢 —— 連「使用者是點連結才換頁的」都不算數(實測:換頁後立刻
  requestFullscreen 會 REJECT "Permissions check failed")。所以在一般瀏覽器分頁裡,
  「換頁不掉全螢幕」的唯一解法就是**不要換頁**:讓頂層 document 永遠是這一頁,全螢幕掛在它身上。

  三個遊戲頁彼此本來就用 <a href> 互連,在 iframe 裡點下去就是換 iframe、外層動都不動,
  所以那三頁的版面一行都不用改;只有 ⛶ 按鈕改成 postMessage 請這裡代勞。

  設計上刻意保持極簡:內層遊戲有自動更新檢查(reload 只會重載 iframe,全螢幕反而不會掉),
  但**這一頁自己不吃那套** —— 所以它必須簡單到幾乎不需要再改。要改請一併想清楚舊使用者
  怎麼拿到新版(靠 sw.js 或關掉重開)。
-->
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#2a1136;overscroll-behavior:none}
  #stage{display:block;width:100%;height:100%;border:0}
  .noscript{color:#eee;font:16px/1.6 system-ui,sans-serif;padding:24px}
  .noscript a{color:#ffd24a}
</style>
</head>
<body>
<!-- ⚠⚠ `web-share` 非加不可(v1.164.0):你畫我猜的「分享這張畫」走 navigator.share(),
     而 Web Share **受權限政策管** —— 內層是 iframe,沒有這一項就直接 NotAllowedError。
     那是「直接開 draw.html 測都正常、包進這個外殼就永遠失敗」的坑,而且只有真機按下去才會發現。 -->
<iframe id="stage" title="遊戲" allow="fullscreen; microphone; autoplay; web-share"></iframe>
<noscript><div class="noscript">這個遊戲需要 JavaScript。<a href="index.html">直接進入首頁</a></div></noscript>
<script>
(function(){
  "use strict";
  /* 只認得這幾個 key —— hash 是外面來的字串,不可以直接拿去當 src
     ⚠⚠ **加新遊戲一定要補進這張表**(v1.181.3 補上漏掉的 flychess / tiaoqi)。
       漏了的症狀有兩個,而且都不會報錯:
         ① app.html#<新遊戲> 的深層連結退回 Bingo(keyOfHash 找不到 key);
         ② 從首頁點進新遊戲後,內層 hello 回報的 page 不在表裡 → cur 停在舊值、
            hash 也不會更新 → 之後**按上一頁的行為會錯亂**。
       ⚠ 而且這一頁自己不吃更新檢查(見上面那段),舊使用者手上的外殼是安裝當天那一份 ——
         那正是下面 hardreload 註解說的「PWA 裝很久的人點新遊戲會被丟回 Bingo」。 */
  var PAGES = { bingo:"index.html", gomoku:"gomoku.html", sudoku:"sudoku.html", mahjong:"mahjong.html", mahjong16:"mahjong16.html", sevens:"sevens.html", big2:"big2.html", blackjack:"blackjack.html", uno:"uno.html", darkchess:"darkchess.html", chengyu:"chengyu.html", draw:"draw.html", flychess:"flychess.html", tiaoqi:"tiaoqi.html" };
  var stage = document.getElementById("stage");

  function keyOfHash(){
    var k = (location.hash || "").replace(/^#/, "");
    return PAGES[k] ? k : "bingo";
  }
  /* 內層按過設定頁的「強制更新」→ 這一頁被重載,網址上帶著 ?fresh=<時間戳>(v1.159.0)。
     ① 先從自己的網址抹掉:PWA 的 start_url 是這一頁,留著會讓「加到主畫面」記到帶參數的網址。
     ② 但要**轉交給 iframe** —— 那個參數是內層在認的(它落地後會抹掉,並回報「已更新到 vX」),
        不轉交的話使用者按完會完全沒有回饋,不知道到底成功了沒。
     ⚠ 只在第一次設 src 時轉交;下面 hashchange 那條(換遊戲)不必帶。 */
  var fresh = (/[?&]fresh=(\d+)/.exec(location.search) || [])[1] || "";
  if(fresh){ try{ history.replaceState(null, "", location.pathname + location.hash); }catch(_){} }
  // 深層連結:app.html#gomoku 直接開五子棋。iOS「加到主畫面」記的是當下網址(含 hash),
  // 所以三個遊戲照樣可以各自加一個直接開該遊戲的圖示。
  var cur = PAGES[keyOfHash()];   // iframe 目前是哪一頁;以內層 hello 回報的為準
  stage.src = cur + (fresh ? "?fresh=" + fresh : "");
  /* 只改 hash 是「同文件導覽」,瀏覽器不會重載這一頁 → 要自己聽(例如點了 app.html#sudoku 的書籤,
     而分頁已經開在 #bingo)。
     ⚠ 兩個坑:
       1. 不認得的 hash 直接不理 —— 別因為別人亂填就把人踢回首頁。
       2. **按上一頁時 iframe 自己也會往回走**,而歷史紀錄裡的 hash 同時會變 → 這裡若馬上設 src,
          等於在瀏覽器的返回之上再疊一次導覽。所以延遲一下,等內層 hello 回報完再比對:
          真的是它自己走回去的,cur 早就對上了,這裡就什麼都不做。
       (回報 hello 用的是 history.replaceState,那個不會觸發 hashchange,不會自己打自己) */
  addEventListener("hashchange", function(){
    var k = (location.hash || "").replace(/^#/, "");
    if(!PAGES[k]) return;
    setTimeout(function(){
      if(PAGES[k] !== cur){ cur = PAGES[k]; stage.src = PAGES[k]; }
    }, 250);
  });

  /* ---------- 全螢幕:由這一層持有 ----------
     內層點 ⛶ → postMessage 過來 → 這裡對「頂層 documentElement」requestFullscreen。
     iframe 之後怎麼換頁都不會動到它。
     ⚠ 靠的是「iframe 內的使用者手勢會把 user activation 傳給祖先 frame」——
       已實測:iframe 內真實點擊 → 這裡 requestFullscreen() 成功。 */
  var FS_KEY = "bingo.fs";
  function fsEl(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function fsSupported(){ var de=document.documentElement; return !!(de.requestFullscreen || de.webkitRequestFullscreen); }
  /* 裝起來的 App(manifest 的 display 是 fullscreen)本來就滿版 —— 這時再呼叫 Fullscreen API
     **只有負分,沒有任何好處**(v1.180.0):
       ① Android 會蓋一句「從螢幕上方向下滑動…」的系統提示,那正是 v1.178.1 改 display 要消掉的東西;
       ② 進了 API 全螢幕之後,**系統返回的第一下會被瀏覽器拿去退出全螢幕**,不會導覽
          → 使用者的感覺是「按返回沒反應,而且畫面閃了一下」。
     所以只要視窗已經是 display-mode: fullscreen,這一層就完全不碰 API,⛶ 改回一句提示。
     ⚠ 判定要窄:**只認 fullscreen,不可以連 standalone 一起認** —— 桌機安裝版是 standalone 視窗,
       那裡的 ⛶ 是真的有用的,一起擋掉就等於把桌機的全螢幕拔了。
     ⚠⚠ **進了 Fullscreen API 之後 `(display-mode: fullscreen)` 也會成立**(規格如此,不是瀏覽器的 bug)
       → 少了第一行那個 fsEl() 排除,「再按一次 ⛶ 退出全螢幕」會被這條守衛自己擋死,
       而且症狀是「按了完全沒反應」。(run-shell-e2e 的第 [6] 節就是守這個)
     ⚠ 這件事量得準的地方只有這一層(頂層 document);內層在 iframe 裡不保證問得到 display-mode。 */
  function displayFs(){
    if(fsEl()) return false;   // 現在的滿版是「我們自己 request 來的」,不是 manifest 給的
    return !!(window.matchMedia && matchMedia("(display-mode: fullscreen)").matches);
  }
  function want(){ try{ return sessionStorage.getItem(FS_KEY) === "1"; }catch(e){ return false; } }
  function setWant(on){ try{ if(on) sessionStorage.setItem(FS_KEY,"1"); else sessionStorage.removeItem(FS_KEY); }catch(e){} }
  function request(){
    var de = document.documentElement, req = de.requestFullscreen || de.webkitRequestFullscreen;
    if(!req) return null;
    try{ return req.call(de); }catch(e){ return null; }
  }
  function toggle(){
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(fsEl()){ setWant(false); if(exit) exit.call(document); return; }
    setWant(true);
    var p = request();
    if(p && p.catch) p.catch(function(){ setWant(false); });
  }
  // 使用者自己按 Esc 退出 → 意願跟著關掉(這一頁永不換頁,所以不需要 fsLeaving 那套)
  function sync(){ setWant(!!fsEl()); }
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);

  function tell(act, extra){
    var msg = { t:"bingo.shell", act:act };
    if(extra) for(var k in extra) msg[k] = extra[k];
    try{ stage.contentWindow.postMessage(msg, "*"); }catch(e){}
  }
  function env(){
    return {
      fsSupported: fsSupported(),
      // ⚠ manifest 的 display 是 **fullscreen**(v1.178.1)→ 裝起來的 App 不吃
      //    (display-mode: standalone),要連 fullscreen 一起認,否則會誤判成「還沒滿版」
      standalone: ("standalone" in navigator && navigator.standalone) ||
                  (window.matchMedia && matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches)
    };
  }

  addEventListener("message", function(e){
    // 身分檢查用 source(比對 origin 在 file:// 會是 "null",這樣寫本機直接開也能用)
    if(e.source !== stage.contentWindow) return;
    var d = e.data;
    if(!d || d.t !== "bingo.fs") return;

    if(d.act === "hello"){
      // 內層回報自己是哪一頁 → 記下來(hashchange 要靠它判斷「是不是它自己走過去的」)
      // 並更新 hash(用 replaceState,iframe 導覽本身已經有一筆歷史了,不要再多疊一筆)
      if(PAGES[d.page]){
        cur = PAGES[d.page];
        var h = "#" + d.page;
        if(location.hash !== h){ try{ history.replaceState(null, "", h); }catch(_){} }
      }
      tell("env", env());
      return;
    }
    if(d.act === "toggle"){
      /* 回 "unsupported" 不是在說謊,它的語意就是「外殼不會幫你進 API 全螢幕」——
         內層收到後跑 fsFallbackTip(),而它會依 standalone 分岔:安裝版跳「已是全螢幕模式 👍」,
         iPhone Safari 才跳「加入主畫面」那句。所以這裡不必新增 act(內層那兩份雙胞胎一行都不用動)。 */
      if(!fsSupported() || displayFs()){ tell("unsupported", env()); return; }
      toggle();
      return;
    }
    if(d.act === "gesture"){
      // 這一頁被 F5 重載過(全螢幕掉了但意願還記著)→ 借內層這一下手勢接回來
      if(displayFs()) return;   // 安裝版已滿版,永遠不要自己跳進 API 全螢幕(理由見 displayFs)
      if(want() && !fsEl() && fsSupported()) request();
      return;
    }
    if(d.act === "hardreload"){
      /* 內層按了設定頁的「強制更新」(v1.159.0)。這一頁自己**不吃**更新檢查(見開頭那段),
         所以只重載 iframe 的話,舊外殼會原封不動留著 —— 那正是「PWA 裝很久的人點新遊戲
         會被丟回 Bingo」的成因(PAGES 是安裝當天那一份)。
         ⚠ 內層已經清完 Cache Storage、註銷了 SW、也用 cache:"reload" 重抓過資源,
           這裡只負責換掉頂層 document;帶 ?fresh= 是為了繞掉 HTML 的 HTTP 快取。
         ⚠ 重載後上面會依 hash 重設 stage.src → iframe 跟著換新的,內層不必自己再 reload
           (它那邊那個 1.2 秒的 setTimeout 是給**不認得這個 act 的舊外殼**墊底用的)。 */
      location.replace(location.pathname + "?fresh=" + Date.now() + location.hash);
      return;
    }
  });
})();
</script>
</body>
</html>
