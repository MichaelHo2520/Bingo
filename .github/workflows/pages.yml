# GitHub Pages 部署 —— 純靜態上傳,不跑 Jekyll
#
# ⚠⚠⚠ **目前這個 workflow 是「備用」,沒有在跑**(2026-08-17)。
#   repo 設定回到 `build_type=legacy`,線上版由 GitHub 內建的
#   `pages-build-deployment` 部署。原因與怎麼切回來,見檔尾「現在為什麼是備用」。
#   ★ 所以 `on:` 底下**刻意只留 workflow_dispatch** —— 掛著 `push` 的話每次推都會
#     多一個失敗的紅 X(它現在一定失敗),而那種常態性的紅會讓人以後看不出真的壞掉。
#
# ★★ 為什麼從「Deploy from a branch」(legacy)換過來(2026-08-17):
#   legacy 的 Pages build 會在 GitHub 側跑一輪 Jekyll。這個專案一個 Jekyll 功能都沒用到,
#   卻要為它付兩個代價,而且**兩個都咬過**:
#     ① 慢 —— 成功那幾次都要 ~117 秒(它得掃過 215 個檔,含 13MB 的 mp3)
#     ② ⚠⚠ **失敗時只給一句 "Page build failed."**,沒有任何 log:
#        commit 62b4a77 那次就是這樣掛掉的(`duration: 0` = 根本沒跑起來),
#        接著 8bf3c53 卡在 `building` 十幾分鐘不動 →
#        **線上版整整停在兩個 commit 之前,而 repo 本身完全正常**
#        (檢查過:111 個文字檔都是合法 UTF-8、13MB 遠低於 1GB、沒有 Liquid 標記、
#         沒有 symlink、README 沒有壞掉的 front matter)。
#        那種「推上去了但線上沒變、也查不出為什麼」是最貴的一種壞法。
#   → 換成 Actions 之後:不跑 Jekyll、**失敗看得到完整 log**、通常幾十秒。
#
# ⚠ 這個檔要配合 repo 設定一起改(缺一個都不會生效):
#     Settings → Pages → Source = **GitHub Actions**
#   等價的指令:gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow
#   ⚠ 要回退成舊做法就把 build_type 改回 legacy(那時這個 workflow 會變成空轉)。
#
# ⚠ 上傳的是**整個 repo 根目錄**(path: .)—— 這個專案沒有建置步驟,
#   `styles.css` 是本機 `node tools/build-css.js` 產生後就進版控的(見 CLAUDE.md 紅線 6),
#   所以 CI 這裡刻意**不跑任何 build**:CI 自己 build 一次就等於多了一個
#   「線上與本機不一致」的來源,而那正是 styles.css 這種產生檔最怕的事。

name: Deploy static site to Pages

on:
  # ⚠ 只有手動 —— 見檔頭那條(現在是備用,掛 push 會每次留一個紅 X)。
  #   要正式接管部署時,把下面兩行的註解拿掉、並把 build_type 改成 workflow。
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署;⚠ cancel-in-progress 刻意是 false ——
# 取消進行中的部署可能讓站台停在半完成的狀態。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整個 repo 根目錄。.nojekyll 也在裡面(雙保險:artifact 端也不做 Jekyll 處理)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ============================================================================
# 現在為什麼是備用(2026-08-17 的實測紀錄,免得下一個人重走一遍)
# ----------------------------------------------------------------------------
# 那天線上版停在兩個 commit 之前,而 repo 完全正常。查到最後**根因在 GitHub 側**:
#
#   legacy build(62b4a77 / 8bf3c53 兩次都掛):
#     ##[error]Failed to download action 'actions/jekyll-build-pages'
#     Error: 503 (Service Unavailable) → 429 (Too Many Requests) ×3 attempts
#
#   換成這個 workflow 之後**一樣掛**,只是換一個 action 的名字:
#     Failed to download archive 'actions/configure-pages' after 3 attempts  (429)
#     Failed to download archive 'actions/deploy-pages' after 3 attempts     (429)
#
# 也就是說那段時間 codeload.github.com 對這個 repo 在限流,**兩種管線都會中** ——
# 不是 Jekyll 的錯,也不是 `styles.css` 的錯(當時很容易誤判成後者:
# 失敗的兩次剛好都改了 styles.css,沒改的那次成功,而 legacy 的錯誤訊息只有
# 一句 "Page build failed."、`duration: 0`)。
#
# ★ 最後可用的組合(實測):**legacy + `.nojekyll`** —— 那次成功只花 **48 秒**
#   (加 `.nojekyll` 之前是 117 秒),因為 Jekyll 那一段整個跳過了。
#   所以 `.nojekyll` 留著是淨賺:build 快一倍 = 撞上限流的窗口小一半。
#
# ── 什麼時候把這個 workflow 接回來 ──────────────────────────────────────────
#   ① 手動跑一次(Actions 頁面 → 這個 workflow → Run workflow),確認不再 429;
#   ② 成功之後:把上面 `on:` 的 push 兩行解註解;
#   ③ `gh api -X PUT repos/<owner>/<repo>/pages -f build_type=workflow`。
#   ⚠ ②③ 少一個都不會生效:只改設定 → 推 code 不會觸發部署;只解註解 → 跑得起來
#     但 deploy-pages 那一步會因為 Pages 還是 legacy 而失敗。
#   ⚠ 回退:`build_type=legacy` + 把 push 兩行改回註解。
# ============================================================================
